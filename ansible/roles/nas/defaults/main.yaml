---

# mergerfs pool
nas_pool_mountpoint: /mnt/storage
nas_mergerfs_options: "cache.files=partial,dropcacheonclose=true,category.create=mfs,minfreespace=50G,fsname=mergerfs"

# data and parity disks are defined per-host in the inventory.
# disks are expected to be pre-formatted ext4 with the matching LABEL.
nas_data_disks: []
nas_parity_disks: []

# snapraid
nas_snapraid_conf_path: /etc/snapraid.conf
nas_snapraid_excludes:
  - "*.unrecoverable"
  - "/tmp/"
  - "/lost+found/"
  - ".Trash-*"
  - "*.!sync"
  - "*.tmp"

# snapraid-runner (nightly sync + scrub)
nas_snapraid_runner_dir: /opt/snapraid-runner
nas_snapraid_runner_log: /var/log/snapraid-runner.log
nas_snapraid_sync_oncalendar: "*-*-* 03:00:00"
nas_snapraid_scrub_enabled: true
nas_snapraid_scrub_percent: 8
nas_snapraid_scrub_older_than: 10

# nfs export of the mergerfs pool
# clients: anyone on the private 10.0.0.0/8 network
nas_nfs_export_clients:
  - 10.0.0.0/8
# any fsid works for re-exporting a fuse filesystem, but keep it non-zero:
# fsid=0 would make the export the nfsv4 pseudoroot, forcing v4 clients to
# mount "server:/" instead of the real path; no_root_squash lets cluster
# pods (root) write; insecure allows clients on high ports (e.g. macOS)
nas_nfs_export_options: "rw,sync,fsid=100,no_subtree_check,no_root_squash,insecure"
