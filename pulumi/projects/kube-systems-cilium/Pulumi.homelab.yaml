config:
  # ref: https://artifacthub.io/packages/helm/cilium/cilium
  cilium:chartVersion: 1.19.7
  # CIDR that LB-IPAM allocates LoadBalancer service addresses from. Advertised
  # to the UDM-SE as /32 host routes via BGP, so the .0.0 network address routes
  # fine and does not need excluding.
  cilium:loadBalancerCIDR: 10.35.0.0/16
  # BGP: on-prem nodes (localASN) peer with the UDM-SE (peerASN @ peerAddress)
  # and advertise LoadBalancer IPs to it
  cilium:bgpLocalASN: 65001
  cilium:bgpPeerASN: 65000
  cilium:bgpPeerAddress: 10.32.0.1
  # ref: https://artifacthub.io/packages/helm/cilium/cilium#values
  cilium:chartValues:
    ipv4:
      enabled: true
    ipv6:
      enabled: false
    operator:
      replicas: 1
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: 10.34.0.0/16
    bgpControlPlane:
      enabled: true
    k8sServiceHost: 10.32.10.1
    k8sServicePort: 6443
    kubeProxyReplacement: true
    externalIPs:
      enabled: true
